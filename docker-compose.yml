# Uso:
#   cp .env.example .env    # y rellena JWT_SECRET
#   docker compose up -d --build
#   docker compose run --rm app node dist/seed.js   # cargar plantillas (una vez)
# La app queda en http://localhost:3000

services:
  mongo:
    image: mongo:8.0
    container_name: buildit-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: buildit-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/buildit
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env de la raíz}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
